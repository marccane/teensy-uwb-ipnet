; Teensy 4.0 + DW1000: IP-over-UWB modem firmware.
;
;   pio run                 build
;   pio run -t upload       build and flash
;   pio device monitor -p /dev/ttyACM1    console (second USB serial port)
;
; Host-side unit tests for the hardware-independent modules: make -C tests

[platformio]
default_envs = teensy40

[env:teensy40]
platform = teensy@5.0.0
board = teensy40
framework = arduino
upload_protocol = teensy-cli
; Two CDC ports: the first carries framed IP packets for the host daemon, the
; second is the text console.
build_flags = -D USB_DUAL_SERIAL
build_src_flags = -Wall -Wextra -Werror=return-type
